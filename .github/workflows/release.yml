name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5

    - name: Setup UPX
      run: |
        cd ..
        wget https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-amd64_linux.tar.xz
        tar xf upx-5.0.2-amd64_linux.tar.xz
        echo "upx=../upx-5.0.2-amd64_linux/upx" >> $GITHUB_ENV

    - uses: actions/setup-go@v6

    - name: Build Linux
      run: |
        mkdir -p bin out
        make linux-386
        make linux-amd64
        make linux-arm64
        make releases

    - uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: out/*

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6

    - name: Build macOS
      run: |
        mkdir -p bin out
        make darwin-amd64
        make darwin-arm64
        make releases

    - uses: actions/upload-artifact@v4
      with:
        name: macos-artifacts
        path: out/*

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6

    - name: Build Windows
      shell: bash
      run: |
        mkdir -p bin out
        make windows-386
        make windows-amd64
        make releases

    - uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: out/*

  upload-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: out/

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body: New Release.
        files: out/**/*

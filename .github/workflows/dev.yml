name: Build Dev

on:
  workflow_dispatch:
  push:
    branches:
      - "dev"

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
          - goos: linux
            goarch: arm64
            runner: ubuntu-22.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux C++ toolchain
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Make on Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install make --yes --no-progress

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make package VERSION="${GITHUB_SHA:0:7}" BRANCH=Beta/dev

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/MacArthurGo-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  upload-prerelease:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Prepare prerelease files
        shell: bash
        run: |
          upload_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"version":"%s","upload_time":"%s"}\n' "$GITHUB_SHA" "$upload_time" > out/version.json
          printf 'Release created at %s\nCommit: %s\nLatest build from %s\n' "$upload_time" "$GITHUB_SHA" "$GITHUB_REF_NAME" > release.txt

      - name: Update prerelease tag
        uses: richardsimko/update-tag@v3
        with:
          tag_name: Prerelease-${{ github.ref_name }}
          github_token: ${{ github.token }}

      - name: Remove old prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="Prerelease-${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
          fi

      - name: Upload prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Prerelease-${{ github.ref_name }}
          files: out/*
          prerelease: true
          generate_release_notes: true
          body_path: release.txt
          fail_on_unmatched_files: true
          overwrite_files: true
